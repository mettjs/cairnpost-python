[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "cairnpost"
dynamic = ["version"]
description = "The Python client for CairnPost, a self-hostable gateway for transactional email."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Ramirez" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["cairnpost", "email", "transactional", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mettjs/cairnpost-python"
Changelog = "https://github.com/mettjs/cairnpost-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/mettjs/cairnpost-python/issues"

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.5"]

[tool.hatch.version]
path = "src/cairnpost/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnpost"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
  "PLR2004", # a status such as 404 is said as it is
  "PLR0913", # a call takes what the API takes
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B904", "E501", "SIM117", "UP031"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
